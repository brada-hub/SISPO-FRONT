services:
  sispo-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SISPO_BACK_URL=${VITE_SISPO_BACK_URL:-https://api.sispo.unitepc.pro}
        - VITE_SSO_FRONT_URL=${VITE_SSO_FRONT_URL:-https://sigeth.unitepc.pro}
        - VITE_SIGVA_FRONT_URL=${VITE_SIGVA_FRONT_URL:-https://sigva.unitepc.pro}
        - VITE_SHARED_ASSET_URL=${VITE_SHARED_ASSET_URL:-https://api.sigeth.unitepc.pro}
    container_name: sispo-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-9001}:9001"
    networks:
      - th-ecosystem

networks:
  th-ecosystem:
    external: true
